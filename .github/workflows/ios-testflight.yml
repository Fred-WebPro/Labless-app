# Builds the iOS app on a GitHub macOS runner and uploads it to App Store Connect (TestFlight).
# `eas build --local` runs the build here, so it does not use the Expo cloud build quota.
# Signing credentials and the App Store Connect API key are stored in Expo
# (set up once with `npx eas-cli credentials -p ios`), so the only secret is:
#   EXPO_TOKEN     expo.dev → Account settings → Access tokens
name: iOS → TestFlight

on:
  workflow_dispatch:

concurrency:
  group: ios-testflight
  cancel-in-progress: false

jobs:
  ios:
    runs-on: macos-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: eas build --platform ios --profile production --local --non-interactive --output "$RUNNER_TEMP/labless.ipa"

      - name: Keep the .ipa for 7 days
        uses: actions/upload-artifact@v4
        with:
          name: labless-ios
          path: ${{ runner.temp }}/labless.ipa
          retention-days: 7

      - name: Upload to App Store Connect
        run: eas submit --platform ios --profile production --path "$RUNNER_TEMP/labless.ipa" --non-interactive
