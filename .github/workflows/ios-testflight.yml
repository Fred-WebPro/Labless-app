# Builds the iOS app on a GitHub macOS runner and uploads it to App Store Connect (TestFlight).
# `eas build --local` runs the build here, so it does not use the Expo cloud build quota.
# Signing credentials come from Expo (set up once with `npx eas-cli credentials -p ios`).
#
# Secrets (repo Settings → Secrets and variables → Actions):
#   EXPO_TOKEN     expo.dev → Account settings → Access tokens
#   ASC_KEY_ID     App Store Connect → Users and Access → Integrations → API key ID
#   ASC_ISSUER_ID  same page, Issuer ID
#   ASC_KEY_P8     full text of the downloaded AuthKey_XXXX.p8 file
name: iOS → TestFlight

on:
  workflow_dispatch:

concurrency:
  group: ios-testflight
  cancel-in-progress: false

jobs:
  ios:
    runs-on: macos-latest
    timeout-minutes: 75
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: eas build --platform ios --profile production --local --non-interactive --output "$RUNNER_TEMP/labless.ipa"

      - name: Keep the .ipa for 7 days
        uses: actions/upload-artifact@v4
        with:
          name: labless-ios
          path: ${{ runner.temp }}/labless.ipa
          retention-days: 7

      - name: Upload to App Store Connect
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          printf '%s\n' "$ASC_KEY_P8" > ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8
          xcrun altool --upload-app --type ios --file "$RUNNER_TEMP/labless.ipa" --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
          rm -f ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8
